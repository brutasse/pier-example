name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install rig (binary, JVM, cache)
        uses: brutasse/setup-rig@b204f6b12fde6574ebbebe0227fcaaa10391882f # v2.0.0
        with:
          version: v0.5.0

      - name: Rig gate config
        run: |
          mkdir -p "$HOME/.config/rig"
          cp pier/rig-auth-gha.yaml "$HOME/.config/rig/auth.yaml"

      - name: Check and test
        run: |
          rig check
          rig test
