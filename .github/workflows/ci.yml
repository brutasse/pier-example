name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install rig (binary, JVM, cache)
        uses: brutasse/setup-rig@b204f6b12fde6574ebbebe0227fcaaa10391882f # v2.0.0
        with:
          version: v0.4.1

      - name: Rig gate config
        run: |
          mkdir -p "$HOME/.config/rig"
          cp pier/rig-auth-gha.yaml "$HOME/.config/rig/auth.yaml"

      - name: Request the OIDC token
        id: token
        run: |
          oidc="$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            -d audience="https://194.182.165.182/" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL?audience=https%3A%2F%2F194.182.165.182%2F")"
          [ -n "$oidc" ] || { echo "no OIDC token" >&2; exit 1; }
          echo "oidc=$oidc" >> "$GITHUB_OUTPUT"

      - name: Check and test
        env:
          RIG_TOKEN_PIER: ${{ steps.token.outputs.oidc }}
        run: |
          rig check || {
            # rig only prints the status code; pier's response body
            # carries the exact refusal reason (issuer, audience, JWKS).
            echo "== pier's view of the token =="
            curl -sS -w '\nstatus: %{http_code}\n' \
              -H "Authorization: Bearer $RIG_TOKEN_PIER" \
              "http://194.182.165.182/org/clojure/clojure/1.12.5/clojure-1.12.5.pom" | head -5
            exit 1
          }
          rig test
